[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "battlechain-lib/=lib/battlechain-lib/src/",
    "bc-confidence-pools/=lib/bc-confidence-pools/src/",
    # The canonical confidence-pool interfaces import their own types via a bare `src/...`
    # path. Scope this remapping to the submodule ONLY — a global `src/=` also rewrites
    # this repo's own relative imports (e.g. Exploit.sol's `./Attacker.sol`), which breaks
    # contract verification (the verifier misresolves `src/Attacker.sol` to the submodule).
    "lib/bc-confidence-pools/:src/=lib/bc-confidence-pools/src/",
]

[rpc_endpoints]
battlechain = "https://testnet.battlechain.com"
battlechain-mainnet = "https://mainnet.battlechain.com"

[etherscan]
battlechain = { key = "not-required", url = "https://block-explorer-app-mu.vercel.app/" }
battlechain-mainnet = { key = "not-required", url = "https://block-explorer-api.mainnet.battlechain.com/api" }

[lint]
exclude_lints = ["mixed-case-variable"]
# Lint only this repo's own contracts. Scripts import the vendored confidence-pool
# interfaces, whose internal `src/libraries/PoolStates.sol` import solc resolves via
# the remapping above but the solar lint pass does not — so exclude scripts (and tests).
ignore = ["test/**/*", "script/**/*"]
